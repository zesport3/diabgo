<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#06B6D4" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Stylized Blood Drop -->
  <path d="M256 90 C256 90, 140 240, 140 330 A116 116 0 0 0 372 330 C372 240, 256 90, 256 90 Z"
        fill="url(#dropGrad)"
        filter="url(#glow)"/>

  <!-- Glucose Pulse / Heartbeat Line inside the drop -->
  <path d="M190 330 L220 330 L238 280 L256 370 L276 300 L294 340 L322 340"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
